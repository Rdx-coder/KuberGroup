<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Start your development with Rubic landing page.">
    <meta name="author" content="Devcrud">
    <title>WITHDRAW</title>
    <!-- font icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/themify-icons/1.0.1/css/themify-icons.min.css">
    <!-- Bootstrap + Steller  -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="rubic/public_html/assets/css/rubic.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/themify-icons/1.0.1/css/themify-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        /* Custom Styles */
        .payment-icons {
            font-size: 24px;
            margin-top: 10px;
        }

        .payment-icons i {
            margin: 0 10px;
        }

        canvas {
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <!-- Page Header -->
    <section class="section" id="contact">
        <div class="container text-center">
            <h6 class="display-4 has-line">WITHDRAW</h6>
            <p class="mb-5 pb-2">YOU WILL RECEIVE YOUR AMOUNT WITHIN 24 HOURS</p>

            <form action="Withdraw" method="post">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <div class="form-group pb-1">
                            <input type="text" class="form-control" required placeholder="REFERENCE ID" name="reference_id">
                        </div>
                        <div class="form-group pb-1">
                            <input type="password" class="form-control" required placeholder="MPIN" name="m_pin">
                        </div>
                        <div class="form-group pb-1">
                            <input type="text" class="form-control" placeholder="ACCOUNT NO." name="account_no">
                        </div>
                        <div class="form-group pb-1">
                            <input type="text" class="form-control" placeholder="ACCOUNT HOLDER NAME" name="account_holder_name">
                        </div>
                        <div class="form-group pb-1">
                            <input type="text" class="form-control" placeholder="UPI ID" name="upi_id">
                        </div>
                        <div class="form-group pb-1">
                            <input type="text" class="form-control" placeholder="AMOUNT" name="amount">
                        </div>
                        <div class="form-group pb-1">
                            <input type="email" class="form-control" placeholder="EMAIL ID" name="email_id"> <!-- New field for email id -->
                        </div>
                    </div>
                </div>
                <div class="row justify-content-center mt-3">
                    <div class="col-md-6">
                        <div class="payment-icons">
                            <i class="fab fa-google"></i> <!-- Google Pay Icon -->
                            <i class="fab fa-paypal"></i> <!-- Paytm Icon -->
                            <i class="fas fa-credit-card"></i> <!-- Card Icon -->
                        </div>
                    </div>
                </div>
                <div class="row justify-content-center mt-3">
                    <div class="col-md-6">
                        <input type="submit" class="btn btn-primary btn-block" value="SUBMIT">
                    </div>
                </div>
            </form>

            <!-- Chart.js Canvas -->
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <canvas id="withdrawalChart" width="400" height="200"></canvas>
                </div>
            </div>
        </div>
    </section>

    <!-- main content -->
    <div class="container">
        <h3 class="mt-5 text-center">Copyright 2015
            <script>
                document.write(new Date().getFullYear())
            </script>
            &copy; <a href="http://www.greatvison.com">KuberGroup</a>
        </h3>
    </div>
    <footer class="footer py-4 bg-light">
        <div class="container text-center">
            <div class="social-links">
                <a href="javascript:void(0)" class="text-dark"><i class="ti-facebook"></i></a>
                <a href="javascript:void(0)" class="text-dark"><i class="ti-twitter-alt"></i></a>
                <a href="javascript:void(0)" class="text-dark"><i class="ti-google"></i></a>
                <a href="javascript:void(0)" class="text-dark"><i class="ti-pinterest-alt"></i></a>
                <a href="javascript:void(0)" class="text-dark"><i class="ti-instagram"></i></a>
                <a href="javascript:void(0)" class="text-dark"><i class="ti-rss"></i></a>
            </div>
        </div>
    </footer>

    <!-- core  -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // Sample data for demonstration purposes
        var withdrawalData = {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
            datasets: [{
                label: 'Withdrawals',
                data: [50000, 70000, 60000, 80000, 90000, 75000],
                backgroundColor: 'rgba(54, 162, 235, 0.5)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        };

        // Get the canvas context
        var ctx = document.getElementById('withdrawalChart').getContext('2d');

        // Create the chart
        var withdrawalChart = new Chart(ctx, {
            type: 'line',
            data: withdrawalData,
            options: {
                scales: {
                    yAxes: [{
                        ticks: {
                            beginAtZero: true
                        }
                    }]
                }
            }
        });
    </script>
</body>

</html>
