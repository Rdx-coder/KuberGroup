<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .card {
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            width: 300px; /* Set a fixed width for the card */
            margin: auto;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #3498DB, #E74C3C);
            border-radius: 10px;
            padding: 20px;
        }

        .title {
            color: white;
            font-size: 18px;
        }

        button {
            border: none;
            outline: 0;
            display: inline-block;
            padding: 8px;
            color: white;
            background-color: #000;
            text-align: center;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
        }

        a {
            text-decoration: none;
            font-size: 22px;
            color: white;
        }

        button:hover, a:hover {
            opacity: 0.7;
        }

        /* Responsive styles */
        @media screen and (max-width: 600px) {
            .card {
                width: 100%; /* Set width to 100% on smaller screens */
            }
        }
    </style>
</head>
<body>

<h2 style="text-align:center">ADD FUND</h2>

<div class="card">
    <img src="rubic/public_html/assets/imgs/qr.jpg.jpeg" alt="SCANNER" style="width:100%">
    
    <p class="title"></p>
    <p></p>
    
       <p><button>ADD FUND WITH QR CODE</button></p>
   
    </div>

</body>
</html>
